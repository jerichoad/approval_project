info:
  name: List Access Requests - All (Auditor)
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/api/access-requests?scope=all"
  headers:
    - name: accept
      value: application/json
    - name: X-User-Email
      value: "{{erinEmail}}"
  body:
    type: none
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function() {
          expect(res.status).to.equal(200);
        });

        test("Auditor can see all requests", function() {
          expect(res.body).to.be.an("array");
        });

settings:
  encodeUrl: true
