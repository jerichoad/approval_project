info:
  name: List Access Requests - Mine
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/access-requests?scope=mine"
  headers:
    - name: accept
      value: application/json
    - name: X-User-Email
      value: "{{aliceEmail}}"
  body:
    type: none
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function() {
          expect(res.status).to.equal(200);
        });

        test("All items belong to Alice", function() {
          expect(res.body).to.be.an("array");
          if (res.body.length > 0) {
            expect(res.body[0].requester.email).to.equal("alice@example.local");
            bru.setVar("requestId", res.body[0].id);
            bru.setVar("requestVersion", res.body[0].version);
          }
        });

settings:
  encodeUrl: true
