info:
  name: Get Applications
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/applications"
  headers:
    - name: accept
      value: application/json
    - name: X-User-Email
      value: "{{userEmail}}"
  body:
    type: none
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function() {
          expect(res.status).to.equal(200);
        });

        test("Envelope Status is S", function() {
          expect(res.body.Status).to.equal("S");
        });

        test("Returns applications with system owner", function() {
          const apps = res.body.Data;
          expect(apps).to.be.an("array");
          expect(apps.length).to.be.above(0);
          expect(apps[0]).to.have.property("code");
          expect(apps[0]).to.have.property("systemOwner");
        });

settings:
  encodeUrl: true
