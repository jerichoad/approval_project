info:
  name: List Access Requests - Mine
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/access-requests?scope=mine"
  headers:
    - name: accept
      value: application/json
    - name: X-User-Email
      value: "{{aliceEmail}}"
  body:
    type: none
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function() {
          expect(res.status).to.equal(200);
        });

        test("Envelope Status is S", function() {
          expect(res.body.Status).to.equal("S");
        });

        test("All items belong to Alice", function() {
          const list = res.body.Data;
          expect(list).to.be.an("array");
          if (list.length > 0) {
            expect(list[0].requester.email).to.equal("alice@example.local");
            bru.setVar("requestId", list[0].id);
            bru.setVar("requestVersion", list[0].version);
          }
        });

settings:
  encodeUrl: true
