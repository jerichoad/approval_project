info:
  name: Get Inbox
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/approvals/inbox"
  headers:
    - name: accept
      value: application/json
    - name: X-User-Email
      value: "{{bobEmail}}"
  body:
    type: none
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function() {
          expect(res.status).to.equal(200);
        });

        test("Envelope Status is S", function() {
          expect(res.body.Status).to.equal("S");
        });

        test("Returns array", function() {
          expect(res.body.Data).to.be.an("array");
        });

settings:
  encodeUrl: true
