info:
  name: Get Users
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/users"
  headers:
    - name: accept
      value: application/json
  body:
    type: none
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function() {
          expect(res.status).to.equal(200);
        });

        test("Envelope Status is S", function() {
          expect(res.body.Status).to.equal("S");
        });

        test("Returns user list", function() {
          const users = res.body.Data;
          expect(users).to.be.an("array");
          expect(users.length).to.be.above(0);
          expect(users[0]).to.have.property("id");
          expect(users[0]).to.have.property("email");
          expect(users[0]).to.have.property("displayName");
        });

settings:
  encodeUrl: true
