info:
  name: Get Me Unauthenticated
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/me"
  headers:
    - name: accept
      value: application/json
    - name: X-User-Email
      value: unknown@example.local
  body:
    type: none
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 401", function() {
          expect(res.status).to.equal(401);
        });

        test("Envelope Status is E", function() {
          expect(res.body.Status).to.equal("E");
        });

        test("Error code UNAUTHENTICATED", function() {
          expect(res.body.Data.code).to.equal("UNAUTHENTICATED");
        });

settings:
  encodeUrl: true
