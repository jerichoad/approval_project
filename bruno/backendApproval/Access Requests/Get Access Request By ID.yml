info:
  name: Get Access Request By ID
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/api/access-requests/{{requestId}}"
  headers:
    - name: accept
      value: application/json
    - name: X-User-Email
      value: "{{aliceEmail}}"
  body:
    type: none
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function() {
          expect(res.status).to.equal(200);
        });

        test("Envelope Status is S", function() {
          expect(res.body.Status).to.equal("S");
        });

        test("Response contains detail and audit trail", function() {
          const data = res.body.Data;
          expect(data).to.have.property("id");
          expect(data).to.have.property("status");
          expect(data).to.have.property("allowedActions");
          expect(data.auditTrail).to.be.an("array");
        });

        bru.setVar("requestVersion", res.body.Data.version);

settings:
  encodeUrl: true
