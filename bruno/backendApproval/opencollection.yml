opencollection: 1.0.0

info:
  name: Backend Approval API
config:
  proxy:
    inherit: true
docs:
  type: text/markdown
  content: |-
    # Backend Approval API Collection
    Collection Bruno untuk backendApproval (.NET 8 Web API).
    
    ### Envelope Format
    Semua response API dibungkus dalam format:
    - Sukses: `{ "Status": "S", "Data": <payload> }`
    - Error: `{ "Status": "E", "Data": { "code", "message", "correlationId", "fieldErrors", "extensions" } }`
    
    ### Autentikasi
    Menggunakan header `X-User-Email`. Demo users yang tersedia di database:
    - `alice@example.local` (Requester, Manager: Bob)
    - `bob@example.local` (Manager Alice)
    - `carol@example.local` (System Owner: CRM)
    - `dana@example.local` (System Owner: Finance Portal)
    - `erin@example.local` (Auditor)
