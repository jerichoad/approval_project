info:
  name: Approve - by System Owner
  type: http
  seq: 12

http:
  method: POST
  url: "{{baseUrl}}/api/access-requests/{{highRiskRequestId}}/approve"
  headers:
    - name: accept
      value: application/json
    - name: content-type
      value: application/json
    - name: X-User-Email
      value: "{{carolEmail}}"
  body:
    type: json
    data: |-
      {
        "expectedVersion": {{highRiskRequestVersion}}
      }
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200 OK or 403 if pending manager first", function() {
          expect([200, 403]).to.include(res.status);
        });

        test("Envelope Status matches HTTP result", function() {
          expect(res.body.Status).to.equal(res.status === 200 ? "S" : "E");
        });

settings:
  encodeUrl: true
