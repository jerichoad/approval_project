info:
  name: Get Me
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/me"
  headers:
    - name: accept
      value: application/json
    - name: X-User-Email
      value: "{{userEmail}}"
  body:
    type: none
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function() {
          expect(res.status).to.equal(200);
        });

        test("Envelope Status is S", function() {
          expect(res.body.Status).to.equal("S");
        });

        test("Returns current user profile", function() {
          const me = res.body.Data;
          expect(me).to.have.property("id");
          expect(me).to.have.property("email");
          expect(me).to.have.property("isAuditor");
          expect(me).to.have.property("hasDirectReports");
          expect(me.ownedApplications).to.be.an("array");
        });

settings:
  encodeUrl: true
