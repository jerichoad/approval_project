info:
  name: Create - High Risk Production Admin
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/access-requests"
  headers:
    - name: accept
      value: application/json
    - name: content-type
      value: application/json
    - name: X-User-Email
      value: "{{aliceEmail}}"
  body:
    type: json
    data: |-
      {
        "clientRequestId": "{{$guid}}",
        "applicationId": "{{crmAppId}}",
        "environment": "Production",
        "accessLevel": "Admin",
        "justification": "Need admin access to CRM production for incident response."
      }
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 201 Created", function() {
          expect(res.status).to.equal(201);
        });

        test("Envelope Status is S", function() {
          expect(res.body.Status).to.equal("S");
        });

        test("High risk requires manager then system owner", function() {
          const data = res.body.Data;
          expect(data.isHighRisk).to.equal(true);
          expect(data.status).to.equal("PendingManagerApproval");
        });

        bru.setVar("highRiskRequestId", res.body.Data.id);
        bru.setVar("highRiskRequestVersion", res.body.Data.version);

settings:
  encodeUrl: true
