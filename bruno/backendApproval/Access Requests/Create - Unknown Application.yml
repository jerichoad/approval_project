info:
  name: Create - Unknown Application
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/access-requests"
  headers:
    - name: accept
      value: application/json
    - name: content-type
      value: application/json
    - name: X-User-Email
      value: "{{aliceEmail}}"
  body:
    type: json
    data: |-
      {
        "clientRequestId": "{{$guid}}",
        "applicationId": "00000000-0000-0000-0000-000000000999",
        "environment": "NonProduction",
        "accessLevel": "Read",
        "justification": "Should fail because application does not exist."
      }
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 422 Unprocessable Entity", function() {
          expect(res.status).to.equal(422);
        });

        test("Problem code UNKNOWN_APPLICATION", function() {
          expect(res.body.code).to.equal("UNKNOWN_APPLICATION");
        });

settings:
  encodeUrl: true
